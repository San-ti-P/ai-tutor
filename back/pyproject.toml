[project]
name = "ai-tutor"
version = "0.1.0"
description = "Personal Academic Tutor with LLM Agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langsmith>=0.3.0",
    "langchain-groq>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.6.0",
    "markitdown[pdf]>=0.1.0",
    "aiosqlite>=0.21.0",
    "langfuse>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.18",
    "sentence-transformers>=3.0.0,<4.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langchain-ollama>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: expensive tests requiring real LLM, embeddings, and/or real PDF files. Run with: pytest -m integration",
]
